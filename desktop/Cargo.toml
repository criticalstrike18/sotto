[package]
name = "sotto-desktop"
version = "0.1.0"
edition = "2021"
description = "Sotto: Ultra-fast, zero-friction voice dictation & HUD built with Rust and Slint"
license = "MIT OR Apache-2.0"
repository = "https://github.com/criticalstrike18/sotto"
readme = "../README.md"

[lib]
name = "sotto_desktop"
path = "src/lib.rs"

[[bin]]
name = "sotto-windows"
path = "src/main.rs"

[dependencies]
cpal = "0.15"
reqwest = { version = "0.12", default-features = false, features = ["multipart", "json", "rustls-tls", "http2"] }
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "time"] }
serde = { version = "1.0", default-features = false, features = ["derive", "alloc"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = { version = "1.11", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }

[target.'cfg(not(target_os = "windows"))'.dependencies]
slint = { version = "1.9", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
] }

[target.'cfg(all(target_os = "windows", target_env = "msvc"))'.dependencies]
# Trial Skia (OpenGL surface for DWM transparent pill) + DirectWrite on Windows CI without changing Linux/macOS builds.
slint = { version = "1.9", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-skia-opengl",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
] }

[target.'cfg(all(target_os = "windows", not(target_env = "msvc")))'.dependencies]
# Local GNU toolchains cannot link prebuilt Skia MSVC binaries; fall back to FemtoVG + Software locally.
slint = { version = "1.9", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "accessibility",
    "compat-1-2",
    "raw-window-handle-06",
] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_Touch",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Registry",
    "Win32_Media_Audio",
    "Win32_Security_Cryptography"
] }
windows = { version = "0.62", features = ["Media_Control"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.9"

[target.'cfg(target_os = "windows")'.build-dependencies]
tauri-winres = "0.3.7"

[dev-dependencies]
i-slint-backend-testing = "1.18"

[profile.dev]
debug = 1

[profile.test]
debug = 1

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
