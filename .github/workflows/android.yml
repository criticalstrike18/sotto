name: Sotto Android CI & Release

on:
  push:
    branches: [ "release-main", "staging-test" ]
    tags: [ "android-v*", "v*" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [ "release-main", "staging-test" ]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build-android:
    name: Build Sotto Android (sotto-android.apk)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Check Gradle Setup
        run: |
          if [ -f "android/gradlew" ]; then
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
          else
            echo "Android module not yet scaffolded. Ready for Phase 5 companion app."
          fi
