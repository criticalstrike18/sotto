name: Sotto Desktop CI & Release

# 3-Branch Workflow:
#   - `dev`          : Regular features/WIP pushes (NO GitHub runners triggered)
#   - `staging-test` : Cross-platform build, test & UI screenshot verification
#                      across Windows, Ubuntu Linux (Xvfb), and macOS runners
#   - `release-main` : Production release builds & tag-triggered GitHub Releases
#                      (`desktop-v*` or `v*`)

on:
  push:
    branches: [ "release-main", "staging-test" ]
    tags: [ "desktop-v*", "v*" ]
  pull_request:
    branches: [ "release-main", "staging-test" ]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-desktop:
    name: Build Sotto Desktop (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-name: sotto-windows
            artifact-name: sotto-windows.exe
            binary-path: desktop/target/release/sotto-windows.exe
          - os: ubuntu-latest
            target-name: sotto-linux
            artifact-name: sotto-linux
            binary-path: desktop/target/release/sotto-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxkbcommon-dev libwayland-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build Release Binary
        run: cargo build --release
        working-directory: desktop

      - name: Prepare Linux Binary
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.binary-path }} desktop/target/release/${{ matrix.artifact-name }}
          chmod +x desktop/target/release/${{ matrix.artifact-name }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target-name }}
          path: desktop/target/release/${{ matrix.artifact-name }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/target/release/${{ matrix.artifact-name }}
          generate_release_notes: true

  build-macos-staging:
    name: Build Sotto Desktop (sotto-macos staging)
    runs-on: macos-latest
    if: github.ref_name == 'staging-test' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build macOS Binary
        run: |
          cargo build --release
          cp target/release/sotto-windows target/release/sotto-macos
          chmod +x target/release/sotto-macos
        working-directory: desktop

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: sotto-macos
          path: desktop/target/release/sotto-macos
          if-no-files-found: error

  test-and-preview:
    name: Test & UI Preview (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    if: github.ref_name == 'staging-test' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-name: windows
          - os: ubuntu-latest
            target-name: linux
          - os: macos-latest
            target-name: macos

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Test & Display Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxkbcommon-dev libwayland-dev xvfb ffmpeg

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Run Desktop Test Suite (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path preview-out | Out-Null
          $env:SOTTO_EXPORT_PREVIEW_DIR = "$PWD/preview-out"
          cargo test --no-fail-fast
          if (Get-Command ffmpeg -ErrorAction SilentlyContinue) {
            Get-ChildItem preview-out\*.bmp | ForEach-Object {
              ffmpeg -y -i $_.FullName ($_.FullName -replace '\.bmp$', '.png') -loglevel error
            }
          }
        working-directory: desktop

      - name: Run Desktop Test Suite & UI Snapshots (Linux via Xvfb)
        if: runner.os == 'Linux'
        run: |
          mkdir -p preview-out
          SOTTO_EXPORT_PREVIEW_DIR="$PWD/preview-out" SOTTO_PREVIEW_ONLY=1 xvfb-run -a cargo test --no-fail-fast
          for f in preview-out/*.bmp; do
            ffmpeg -y -i "$f" "${f%.bmp}.png" -loglevel error || true
          done
        working-directory: desktop

      - name: Run Desktop Test Suite & UI Snapshots (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p preview-out
          SOTTO_EXPORT_PREVIEW_DIR="$PWD/preview-out" SOTTO_PREVIEW_ONLY=1 cargo test --no-fail-fast
          for f in preview-out/*.bmp; do
            sips -s format png "$f" --out "${f%.bmp}.png" >/dev/null 2>&1 || true
          done
        working-directory: desktop

      - name: Upload UI Preview Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-previews-${{ matrix.target-name }}
          path: desktop/preview-out/*
          if-no-files-found: warn
