name: Sotto Desktop CI & Release

# - Every push to main / PR builds the Windows .exe (sanity check).
# - Pushing a tag like `desktop-v0.1.0` builds + publishes a GitHub Release
#   with the binaries attached (downloadable from the Releases page).
# - Linux/macOS matrix rows are COMMENTED OUT (PAUSED) until Phase 4 lands.
#   To re-enable: uncomment the rows below — build, rename, upload, and
#   release steps already run off matrix variables, so no other changes needed.

on:
  push:
    branches: [ "main" ]
    tags: [ "desktop-v*", "v*" ]
  pull_request:
    branches: [ "main" ]
    paths:
      - "desktop/**"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  build-desktop:
    name: Build Sotto Desktop (${{ matrix.target-name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target-name: sotto-windows
            artifact-name: sotto-windows.exe
            binary-path: desktop/target/release/sotto-windows.exe
          - os: ubuntu-latest
            target-name: sotto-linux
            artifact-name: sotto-linux
            binary-path: desktop/target/release/sotto-windows

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux GUI Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libfontconfig1-dev libx11-dev libxext-dev libxrender-dev libxkbcommon-dev libwayland-dev

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop

      - name: Build Release Binary
        run: cargo build --release
        working-directory: desktop

      - name: Prepare Linux Binary
        if: runner.os != 'Windows'
        run: |
          cp ${{ matrix.binary-path }} desktop/target/release/${{ matrix.artifact-name }}
          chmod +x desktop/target/release/${{ matrix.artifact-name }}

      - name: Upload Desktop Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target-name }}
          path: desktop/target/release/${{ matrix.artifact-name }}
          if-no-files-found: error

      - name: Publish GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/desktop-v') || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: desktop/target/release/${{ matrix.artifact-name }}
          generate_release_notes: true
